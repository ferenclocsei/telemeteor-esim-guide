<svg viewBox="0 0 300 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="630" fill="#f2f2f7"/>
  <text x="24" y="27" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#182746">9:41</text>
  <g stroke="#182746" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M236 22 l4 -6 l4 6z" fill="#182746" stroke="none"/>
    <path d="M248 22 a7 7 0 0 1 10 0"/>
    <rect x="264" y="15" width="16" height="9" rx="2"/>
    <rect x="266" y="17" width="9" height="5" fill="#182746" stroke="none"/>
  </g>

  <!-- Hero: a strong Wi-Fi mark -->
  <rect x="106" y="120" width="88" height="88" rx="22" fill="#16a06a"/>
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M129 158 a30 30 0 0 1 42 0"/>
    <path d="M138 168 a17 17 0 0 1 24 0"/>
  </g>
  <circle cx="150" cy="180" r="4.5" fill="#ffffff"/>

  <text data-key="screen.stable-internet.title" x="150" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="800" fill="#182746">Stabil internet</text>
  <text data-key="screen.stable-internet.hint" data-maxw="240" x="150" y="278" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#5b6b8c">Wi‑Fi vagy mobilnet — csak stabil legyen</text>

  <!-- Two option chips -->
  <g>
    <rect x="52" y="312" width="88" height="44" rx="22" fill="#ffffff" stroke="#e2e8f2" stroke-width="1"/>
    <g transform="translate(70,334)" stroke="#00a0ff" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M-6 -2 a9 9 0 0 1 12 0"/>
      <path d="M-3 2 a4.5 4.5 0 0 1 6 0"/>
    </g>
    <circle cx="70" cy="340" r="1.8" fill="#00a0ff"/>
    <text data-key="screen.stable-internet.wifi" x="118" y="339" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#182746">Wi‑Fi</text>
  </g>
  <g>
    <rect x="160" y="312" width="88" height="44" rx="22" fill="#ffffff" stroke="#e2e8f2" stroke-width="1"/>
    <g transform="translate(178,342)" fill="#00a0ff">
