  <text data-key="screen.stable-internet.note" data-maxw="248" x="150" y="404" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#8794ab">A telepítéshez internet kell a QR/aktiválás letöltéséhez.</text>

  <rect x="112" y="606" width="76" height="5" rx="2.5" fill="#182746" opacity="0.3"/>
